<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel player</title>
<style>
  :root { --bg: #f5f6f8; --panel: #fff; --ink: #1c2230; --muted: #6a7282; --line: #dde1e8; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg: #13161c; --panel: #1b1f27; --ink: #e6e9ef; --muted: #9199aa; --line: #2b313d; --accent: #6ea0ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  #status { color: var(--muted); margin-left: auto; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #screen { background: #000; max-width: 100%; height: auto; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  aside { flex: 1; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: normal; padding: 3px 8px 3px 0; white-space: nowrap; }
  td { font-variant-numeric: tabular-nums; }
  #chart { width: 100%; height: 90px; border-top: 1px solid var(--line); margin-top: 10px; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Reel player</h1>
  <label>stream <select id="stream"></select></label>
  <label>network <select id="network"></select></label>
  <button id="play">Play</button>
  <span id="status">loading…</span>
</header>
<main>
  <canvas id="screen" width="352" height="288"></canvas>
  <aside>
    <table id="stats"></table>
    <canvas id="chart" width="400" height="90"></canvas>
    <div class="muted">chosen bitrate over time (hybrid ABR); decoding runs in WebAssembly</div>
  </aside>
</main>
<script type="module" src="dist/main.js"></script>
</body>
</html>
